name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: false

      - name: Dotnet Info
        run: |
          dotnet --info
          dotnet --list-sdks
          dotnet --list-runtimes

      - name: Compute version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Restore
        run: dotnet restore src/NuoNuoSdk/NuoNuoSdk.csproj

      - name: Build
        run: |
          dotnet build src/NuoNuoSdk/NuoNuoSdk.csproj -c Release
          ls -la src/NuoNuoSdk/bin/Release || true

      - name: Pack
        run: |
          dotnet pack src/NuoNuoSdk/NuoNuoSdk.csproj -c Release -p:Version=${{ env.VERSION }} -p:IsPackable=true --no-build -o artifacts/nuget
          ls -la artifacts/nuget || true
          ls -la src/NuoNuoSdk/nupkgs || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
            src/NuoNuoSdk/nupkgs/*.nupkg
            src/NuoNuoSdk/nupkgs/*.snupkg

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: NuoNuoOpenSdk v${{ env.VERSION }}
          artifacts: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
            src/NuoNuoSdk/nupkgs/*.nupkg
            src/NuoNuoSdk/nupkgs/*.snupkg
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          generateReleaseNotes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Publish to NuGet.org
        if: ${{ env.NUGET_API_KEY != '' }}
        run: |
          dotnet nuget push artifacts/nuget/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          dotnet nuget push artifacts/nuget/*.snupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          dotnet nuget push src/NuoNuoSdk/nupkgs/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate || true
          dotnet nuget push src/NuoNuoSdk/nupkgs/*.snupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate || true